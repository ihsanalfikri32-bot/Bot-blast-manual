<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruang Kerja Ops</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">

    <div id="panel-login" class="w-full max-w-md glass-panel p-8 text-center animate-fade-up">
        <h2 class="text-2xl font-light mb-2">Otorisasi <span id="tg-name-display" class="font-semibold text-blue-400">Sistem</span></h2>
        <p class="text-sm opacity-60 mb-8 font-light">Identitas Telegram Anda tersinkronisasi.</p>
        
        <div id="fallback-name-container" class="hidden mb-5">
            <input type="text" id="input-nama" class="glass-input block w-full p-4 rounded-xl text-center text-sm" placeholder="Masukkan ID Pekerja...">
        </div>

        <input type="text" id="input-payment" class="glass-input block w-full p-4 rounded-xl mb-8 text-center text-sm tracking-wide" placeholder="Metode Pencairan (Cth: DANA 0812...)">
        <button onclick="simpanDataPekerja()" class="glass-btn btn-primary text-white font-medium py-3.5 px-6 rounded-xl w-full">Akses Ruang Kerja</button>
    </div>

    <div id="panel-workspace" class="w-full max-w-md hidden w-full animate-fade-up">
        
        <div class="glass-panel p-4 mb-4 flex justify-between items-center bg-white/5">
            <div>
                <p class="text-[10px] uppercase tracking-widest opacity-50 font-bold">Operator</p>
                <p id="display-nama" class="font-medium text-sm text-blue-200">Nama</p>
            </div>
            <button onclick="editPembayaran()" class="text-[10px] uppercase tracking-wider glass-btn px-3 py-1.5 rounded-lg opacity-70">Ubah Data</button>
        </div>

        <div class="glass-panel p-4 mb-3 flex justify-between items-center border border-emerald-500/20 bg-emerald-500/10">
            <div>
                <p class="text-[9px] uppercase tracking-widest opacity-70 mb-1 text-emerald-200">Estimasi Pendapatan Baru</p>
                <p id="display-saldo" class="text-xl font-bold text-emerald-400">Rp 0</p>
            </div>
            <button onclick="ajukanPencairan()" class="glass-btn btn-success text-[10px] uppercase tracking-widest font-bold px-4 py-2.5 rounded-xl shadow-lg">Cairkan</button>
        </div>

        <div class="glass-panel p-5 mb-5 relative overflow-hidden">
            <div id="request-area">
                <h3 class="text-sm font-medium mb-3 text-white/80">Pilih Kategori Database</h3>
                <div class="flex gap-2 mb-5">
                    <button id="tab-produka" onclick="pilihKategori('produk_a')" class="flex-1 py-3 glass-btn bg-blue-500/20 text-blue-300 rounded-xl text-xs font-bold border border-blue-500/30 transition">📦 Produk A</button>
                    <button id="tab-produkb" onclick="pilihKategori('produk_b')" class="flex-1 py-3 glass-btn bg-white/5 text-white/50 rounded-xl text-xs font-bold border border-transparent transition">🏷️ Produk B</button>
                </div>

                <div id="grid-sets" class="grid grid-cols-2 gap-3 max-h-[40vh] overflow-y-auto pr-2 custom-scrollbar"></div>
                <div id="empty-state" class="hidden text-center py-10">
                    <p class="opacity-50 text-xs font-light">Kategori ini kosong / habis.</p>
                </div>
            </div>

            <div id="active-task-area" class="hidden animate-fade-up">
                <div class="text-center mb-5">
                    <p id="active-kategori-icon" class="text-2xl mb-1">📦</p>
                    <p id="target-amount-text" class="text-lg font-semibold text-blue-300">Gugus Tugas</p>
                </div>
                
                <div class="flex flex-col items-center bg-black/20 p-4 rounded-2xl mb-5 timer-glow">
                    <span class="text-xs opacity-60 mb-1 font-medium">Sisa Waktu</span>
                    <span id="timer-display" class="font-mono text-4xl font-light text-white">20:00</span>
                </div>

                <div class="mb-3 bg-black/20 p-1 rounded-xl border border-blue-500/20">
                    <div class="flex justify-between items-center p-2 px-3">
                        <label class="text-[10px] uppercase font-bold text-blue-200">Teks Pesan Promosi</label>
                        <button onclick="salinTeksPesan()" class="text-[10px] bg-blue-500/20 text-blue-200 px-3 py-1.5 rounded-md">Salin Teks</button>
                    </div>
                    <textarea id="promo-text-display" rows="3" class="glass-input block w-full p-3 text-[10px] bg-transparent outline-none border-none text-white/80" readonly></textarea>
                </div>

                <div class="mb-5 bg-black/20 p-1 rounded-xl">
                    <div class="flex justify-between items-center p-2 px-3">
                        <label class="text-[10px] uppercase font-bold opacity-70">Data Nomor Target</label>
                        <button onclick="salinNomor()" class="text-[10px] bg-white/10 px-3 py-1.5 rounded-md">Salin Nomor</button>
                    </div>
                    <textarea id="target-numbers-display" rows="3" class="glass-input block w-full p-3 text-xs font-mono bg-transparent outline-none border-none" readonly></textarea>
                </div>

                <div class="flex flex-col gap-2">
                    <button onclick="finishTask()" class="glass-btn btn-success text-white font-medium py-3.5 px-4 rounded-xl shadow-lg">Otorisasi & Selesaikan</button>
                    <div class="grid grid-cols-2 gap-2 mt-1">
                        <button onclick="reportIssue('Ban')" class="glass-btn btn-danger text-xs py-2.5 px-4 rounded-xl">Lapor Ban</button>
                        <button onclick="reportIssue('Limit')" class="glass-btn btn-warning text-xs py-2.5 px-4 rounded-xl">Lapor Limit</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="glass-panel p-5 mb-5">
            <h3 class="text-xs uppercase opacity-50 mb-4">Log Pekerjaan</h3>
            <div class="overflow-y-auto max-h-40 custom-scrollbar pr-2">
                <table class="w-full text-left text-xs"><tbody id="worker-history-list"></tbody></table>
            </div>
        </div>

        <div class="glass-panel p-5 mb-5 border border-emerald-500/10">
            <h3 class="text-xs uppercase opacity-50 mb-4 text-emerald-200">Riwayat Pencairan Anda</h3>
            <div class="overflow-y-auto max-h-40 custom-scrollbar pr-2">
                <table class="w-full text-left text-xs"><tbody id="withdraw-history-list"></tbody></table>
                <div id="withdraw-empty" class="text-center py-4 hidden">
                    <p class="opacity-40 text-xs font-light">Belum ada riwayat penarikan dana.</p>
                </div>
            </div>
        </div>
    </div>
    <!-- Penambahan ?v=2 agar browser memuat pembaruan JS pekerja -->
    <script type="module" src="worker.js?v=2"></script>
</body>
</html>
